services:
  vibeapp-emulator:
    build:
      context: ./docker/emulator
      dockerfile: Dockerfile

    container_name: vibeapp-emulator

    privileged: true

    devices:
      - /dev/kvm:/dev/kvm

    ports:
      - "6080:6080"
      - "5900:5900"
      - "5554:5554"
      - "5555:5555"

    environment:
      ANDROID_SDK_PATH: /android-sdk
      ANDROID_AVD_HOME: /root/.android/avd
      AVD_NAME: vibeapp_emulator
      DISPLAY_ID: :99
      VNC_PORT: 5900
      NOVNC_PORT: 6080

    volumes:
      - /home/zainab1/android-sdk:/android-sdk
      - /home/zainab1/.android:/root/.android

    shm_size: "2gb"

    restart: unless-stopped